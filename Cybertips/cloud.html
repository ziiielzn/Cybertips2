            const flipCard = e.target.closest('.flip-card');
            const dropdownHeader = e.target.closest('.dropdown-header');
            const backButton = e.target.closest('.back-button');
            
            // Hide back button on last slide
            const backButtonElement = document.querySelector('.back-button');
            if (currentSlide === slides.length - 1 && backButtonElement) {
                backButtonElement.style.display = 'none';
            } else if (backButtonElement) {
                backButtonElement.style.display = 'block';
            }

            if (backButton) {
                return;
            } else if (flipCard) {
                e.stopPropagation();
                flipCard.classList.toggle('flipped');
            } else if (dropdownHeader) {
                e.stopPropagation();
                const arrow = dropdownHeader.querySelector('.arrow-mark');
                const translation = dropdownHeader.nextElementSibling;
                arrow.classList.toggle('active');
                translation.classList.toggle('active');
            } else {
                if (currentSlide === slides.length - 1) {
                    // Redirect to quiz page on last slide click

            const backButtonElement = document.querySelector('.back-button');
            if (currentSlide === slides.length - 1 && backButtonElement) {
                backButtonElement.style.display = 'none';
            }
        });

        // Function to update progress bar
        function updateProgressBar() {
            const progress = ((currentSlide + 1) / slides.length) * 100;
            document.querySelector('.progress-bar').style.width = `${progress}%`;
            document.querySelector('.progress-percentage').textContent = `${Math.round(progress)}%`;
        }

        let currentQuestion = 0;
        let score = 0;
        let quizCompleted = false;

        function displayQuestion() {
            const questionContainer = document.getElementById('question-container');
            const questionText = document.getElementById('question-text');
            const options = document.getElementsByClassName('option-btn');
            
            // Remove any existing explanation
            const oldExplanation = questionContainer.querySelector('.explanation-text');
            if (oldExplanation) {
                oldExplanation.remove();
            }
            
            questionText.textContent = quizQuestions[currentQuestion].question;
            for (let i = 0; i < 4; i++) {
                options[i].textContent = quizQuestions[currentQuestion].options[i];
                options[i].className = 'option-btn';
                options[i].disabled = false;
            }
        }

        function checkAnswer(choice) {
            if (quizCompleted) return;
            
            const options = document.getElementsByClassName('option-btn');
            const correct = quizQuestions[currentQuestion].correct;
            
            // Disable all buttons to prevent multiple answers
            Array.from(options).forEach(btn => btn.disabled = true);
            
            options[choice].classList.add(choice === correct ? 'correct' : 'incorrect');
            options[correct].classList.add('correct');
            
            if (choice === correct) score++;
            
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < quizQuestions.length) {
                    displayQuestion();
                } else {
                    showResults();
                }
            }, 1000);
        }

        function showResults() {
            const scorePercent = (score / quizQuestions.length) * 100;
            document.getElementById('question-container').style.display = 'none';
            document.getElementById('score-container').style.display = 'block';
            document.getElementById('score').textContent = scorePercent;
            
            if (scorePercent >= 80) {
                quizCompleted = true;
                document.getElementById('continue-btn').style.display = 'block';
                document.getElementById('retry-btn').style.display = 'none';
            } else {
                document.getElementById('retry-btn').style.display = 'block';
                document.getElementById('continue-btn').style.display = 'none';
            }
        }

        function retryQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('question-container').style.display = 'block';
            document.getElementById('score-container').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
            displayQuestion();
        }

        function proceedToNext() {
            if (quizCompleted) {
                currentSlide++;
                contentDiv.innerHTML = slides[currentSlide];
                contentDiv.scrollTop = 0;
                updateProgressBar();
            }
        }
